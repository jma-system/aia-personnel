name: AIA six fiches — test isolé
on:
  push:
    branches:
      - 'test/six-fiches-repertoire'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/aia-six-static-checks.cjs
